services:
  - type: web
    name: code-radar-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: code-radar-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: 'https://code-radar-frontend(?:-[a-z0-9]+)?\.onrender\.com$'

  - type: web
    runtime: static
    name: code-radar-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: code-radar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: code-radar-db
    plan: free
    region: singapore
    databaseName: coderadar
    user: coderadar
